name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4
        with:
          # check:changelog blames each line and compares against tags. The
          # default shallow, tagless checkout leaves it nothing to inspect, and
          # it would pass without having checked anything.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Enforces the 90% coverage thresholds configured in vitest.config.ts.
      - run: npm test

      - run: npm run build

      # Packs the real tarball and inspects it. `npm test` sees the repository;
      # consumers get whatever `files` happens to include, and 0.2.0 shipped
      # with no license text and 125 kB of unresolvable source maps while the
      # suite was fully green (#98).
      - run: npm run check:package

      # Blames each released entry and checks it predates its tag. Two fixes
      # were credited to 0.3.0 that landed after it was cut (#113), and every
      # step of writing them looked correct.
      - run: npm run check:changelog

      # examples/browser has its own unit tests for the demo's model-cache
      # logic. It depends on the library via file:../.., so build dist first
      # (done above) before typechecking the example.
      - name: Test examples/browser
        working-directory: examples/browser
        run: |
          npm ci
          npm run typecheck
          npm test
