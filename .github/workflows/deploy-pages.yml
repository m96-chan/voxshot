name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Both lock files, because there are two installs in this job — the
          # same reasoning as ci.yml (#122).
          cache-dependency-path: |
            package-lock.json
            examples/browser/package-lock.json

      # Build the library first (examples/browser depends on it via file:../..)
      - name: Install and build library
        run: |
          npm ci
          npm run build

      # Build the browser example
      - name: Build examples/browser
        working-directory: examples/browser
        env:
          # onnxruntime-node's postinstall downloads a CUDA build from
          # api.nuget.org, which no npm cache covers and which failed CI three
          # times on 2026-08-21 (#122). This job runs on every push to main, so
          # it carried the same risk — the fix there missed this workflow.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/browser/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
