name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          # Both lock files, because there are two installs in this job — the
          # same reasoning as ci.yml (#122).
          cache-dependency-path: |
            package-lock.json
            examples/browser/package-lock.json

      # Build the library first (examples/browser depends on it via file:../..)
      - name: Install and build library
        run: |
          npm ci
          npm run build

      # Build the browser example
      - name: Build examples/browser
        working-directory: examples/browser
        env:
          # onnxruntime-node's postinstall downloads a CUDA build from
          # api.nuget.org, which no npm cache covers and which failed CI three
          # times on 2026-08-21 (#122). This job runs on every push to main, so
          # it carried the same risk — the fix there missed this workflow.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm ci
          npm run build

      # Assemble the site: the Chatterbox demo stays at the root (its URLs and
      # its CNAME must not move — #126 is about ADDING a page, not replacing
      # one), and the MioTTS/MioCodec demo goes under /mio/.
      #
      # The mio bundles are **committed build outputs**, copied as-is rather
      # than rebuilt here, because they cannot be rebuilt here: spike/miotts and
      # spike/miocodec depend on `file:../../../web-xpu-ops`, a sibling checkout
      # that does not exist on a CI runner. Freshness is a local gate instead —
      # `npm run build` in both spikes plus `DISPLAY=:1 npm run check:tts`
      # before committing. The grep below is the one thing CI *can* assert: that
      # the bundle being published knows about the Hugging Face asset table, so
      # a bundle still wired to localhost never reaches the public URL.
      - name: Assemble the Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/mio
          cp -R examples/browser/dist/. _site/
          test -s _site/index.html   # the existing demo is still the site index
          test -s _site/CNAME        # the custom domain (examples/browser/public/CNAME)
          cp examples/mio-tts.html examples/mio-tts.js \
             examples/mio-codec.html examples/mio-codec.js \
             examples/mio-codec-fixture.json _site/mio/
          # /mio/ should open the TTS demo, not a 404
          cp examples/mio-tts.html _site/mio/index.html
          grep -q "huggingface.co/m96-chan/MioTTS-0.6B-q8-webgpu" _site/mio/mio-tts.js || {
            echo "examples/mio-tts.js does not reference the Hugging Face q8 repo — it is a stale"
            echo "bundle (rebuild it: cd spike/miotts && npm run build)."
            exit 1
          }
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
